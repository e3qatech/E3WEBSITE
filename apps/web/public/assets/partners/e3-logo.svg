<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="e3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge Container -->
  <rect width="400" height="120" rx="24" fill="#090d16" fill-opacity="0.9" />
  <rect width="400" height="120" rx="24" stroke="url(#e3Grad)" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- E3 Icon Geometry -->
  <g transform="translate(24, 20)">
    <!-- Hexagonal / Energy Shield Emblem -->
    <path d="M40 5 L75 25 L75 65 L40 85 L5 65 L5 25 Z" fill="url(#e3Grad)" fill-opacity="0.15" stroke="url(#e3Grad)" stroke-width="3" />
    <!-- Letter E Cutout Geometry -->
    <path d="M22 28 L56 28 L56 38 L35 38 L35 44 L52 44 L52 52 L35 52 L35 58 L56 58 L56 68 L22 68 Z" fill="#ffffff" />
    <!-- Number 3 Accent Geometry -->
    <path d="M58 28 L72 28 L64 45 C68 46 72 50 72 57 C72 64 66 68 58 68 L58 58 C61 58 63 56 63 53 C63 50 61 48 57 48 L57 40 L64 36 L58 36 Z" fill="url(#e3Grad)" />
  </g>

  <!-- Typography Text -->
  <text x="125" y="56" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="3">E3 QATAR</text>
  <text x="126" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="4">EXPERIENCES &amp; ENTERTAINMENT</text>
  
  <!-- Holographic Core Accent -->
  <circle cx="360" cy="60" r="4" fill="#10b981" filter="url(#glow)" />
  <circle cx="360" cy="60" r="2" fill="#ffffff" />
</svg>
