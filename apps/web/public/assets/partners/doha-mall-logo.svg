<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="dohaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="dohaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Badge Container -->
  <rect width="400" height="120" rx="24" fill="#0c0e14" fill-opacity="0.9" />
  <rect width="400" height="120" rx="24" stroke="url(#dohaGrad)" stroke-width="2" stroke-opacity="0.35" />
  
  <!-- Doha Mall Emblem Geometry -->
  <g transform="translate(26, 22)">
    <!-- Architectural Arches Motif -->
    <path d="M10 70 L10 35 C10 18 24 5 40 5 C56 5 70 18 70 35 L70 70 Z" fill="none" stroke="url(#dohaGrad)" stroke-width="3.5" />
    <path d="M22 70 L22 40 C22 28 30 18 40 18 C50 18 58 28 58 40 L58 70 Z" fill="url(#dohaGrad)" fill-opacity="0.15" stroke="url(#dohaGrad)" stroke-width="2" />
    <circle cx="40" cy="42" r="6" fill="#f59e0b" filter="url(#dohaGlow)" />
  </g>

  <!-- Typography Text -->
  <text x="125" y="54" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="2">DOHA MALL</text>
  <text x="126" y="78" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="4">ABU HAMOUR • QATAR</text>
  
  <!-- Arabic Calligraphic Subtitle -->
  <text x="365" y="68" fill="#f59e0b" font-family="'Cairo', system-ui, sans-serif" font-weight="800" font-size="18" text-anchor="end" opacity="0.9">دوحة مول</text>
</svg>
